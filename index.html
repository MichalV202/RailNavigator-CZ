<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RailNavigator CZ</title>

    <!-- Leaflet mapa -->
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <!-- naše styly -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="map"></div>


    <!-- Rychloměr -->
    <div id="speedometer">
        <div id="speed-value">
            --
        </div>
        <div id="speed-unit">
            km/h
        </div>
    </div>


    <!-- Informační panel -->
    <div id="info-panel">

        <div>
            <strong>Kolej</strong>
            <span id="track">--</span>
        </div>

        <div>
            <strong>Sklon</strong>
            <span id="gradient">-- ‰</span>
        </div>

        <div>
            <strong>Další změna</strong>
            <span id="next-gradient">-- m</span>
        </div>

    </div>


    <!-- Tlačítko sever -->
    <button id="north-button">
        🧭
    </button>


    <!-- Leaflet knihovna -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- naše aplikace -->
    <script src="js/app.js"></script>
    <script src="js/gps.js"></script>

</body>
</html>
