<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="Mobilní železniční navigace s GPS a rychloměrem.">
  <title>RailNavigator CZ</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="map" aria-label="Mapa"></main>

  <section id="speedometer" aria-label="Rychloměr">
    <span id="speed-value">--</span>
    <span id="speed-unit">km/h</span>
  </section>

  <section id="info-panel" aria-label="Informace o jízdě">
    <div><strong>Kolej</strong><span id="track">--</span></div>
    <div><strong>Sklon</strong><span id="gradient">-- ‰</span></div>
    <div><strong>Další změna</strong><span id="next-gradient">-- m</span></div>
    <div><strong>GPS</strong><span id="gps-status">Čekám…</span></div>
  </section>

  <button id="north-button" type="button" aria-label="Vycentrovat na aktuální polohu" title="Vycentrovat na polohu">◎</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./js/app.js"></script>
  <script src="./js/gps.js"></script>
</body>
</html>
